**`firmware/main/fixed_math.h`**

```c
#ifndef FIXED_MATH_H
#define FIXED_MATH_H

#include <stdint.h>

// Define Q8.24 fixed-point type (8 integer bits, 24 fractional bits)
// Uses 32-bit signed integer
typedef int32_t q8_24_t;

// Define constants for Q8.24 format
#define FIXED_POINT_FRACTIONAL_BITS 24
#define FIXED_POINT_ONE             (1L << FIXED_POINT_FRACTIONAL_BITS) // 1.0 in Q8.24
#define INT_TO_FIXED(x)             ((q8_24_t)(x) << FIXED_POINT_FRACTIONAL_BITS)
#define FLOAT_TO_FIXED(x)           ((q8_24_t)((x) * FIXED_POINT_ONE))
#define FIXED_TO_INT(x)             ((x) >> FIXED_POINT_FRACTIONAL_BITS)
#define FIXED_TO_FLOAT(x)           ((float)(x) / FIXED_POINT_ONE)

// Basic Fixed-Point Arithmetic Operations

// Fixed-point addition
static inline q8_24_t q8_24_add(q8_24_t a, q8_24_t b) {
    return a + b;
}

// Fixed-point subtraction
static inline q8_24_t q8_24_sub(q8_24_t a, q8_24_t b) {
    return a - b;
}

// Fixed-point multiplication
// Result is Q16.48, needs shifting back to Q8.24
// Use int64_t for intermediate result to avoid overflow
static inline q8_24_t q8_24_mul(q8_24_t a, q8_24_t b) {
    int64_t temp = (int64_t)a * (int64_t)b;
    // Rounding can be added here: temp += FIXED_POINT_ONE >> 1;
    return (q8_24_t)(temp >> FIXED_POINT_FRACTIONAL_BITS);
}

// Fixed-point division (more complex, might need lookup table or iterative method for performance)
// Basic implementation using 64-bit intermediate:
static inline q8_24_t q8_24_div(q8_24_t a, q8_24_t b) {
    if (b == 0) {
        // Handle division by zero - return max value or error code?
        return INT_TO_FIXED(0x7FFFFFFF); // Return large number as indication
    }
    int64_t temp = (int64_t)a << FIXED_POINT_FRACTIONAL_BITS;
    // Rounding: temp += b >> 1;
    return (q8_24_t)(temp / b);
}

#endif // FIXED_MATH_H