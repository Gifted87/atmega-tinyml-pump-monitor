; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = atmega328p_baremetal

[env:atmega328p_baremetal]
platform = atmelavr
board = uno ; Or pro8MHzatmega328, etc. - Select board matching your hardware clock/voltage.
; We use 'uno' to get the toolchain settings, but won't use Arduino framework libs.
framework = arduino ; We specify Arduino to get the toolchain setup easily,
                    ; BUT WE WILL NOT USE Arduino Core functions (like digitalWrite, etc.)
                    ; We will rely on avr-libc directly.

; Bare-metal C flags
build_flags =
    -Os                 ; Optimize for size
    -Wall               ; Enable all warnings
    -Wextra             ; Enable extra warnings
    -ffunction-sections ; Place each function in its own section
    -fdata-sections     ; Place each data item in its own section
    -nostdlib           ; Exclude standard C libraries (we'll link avr-libc manually if needed, PI usually handles this)
    -mmcu=atmega328p

; Linker flags to garbage collect unused sections
build_unflags = -lm ; Remove default math library if we use custom fixed-point
build_flags +=
    -Wl,--gc-sections

; Monitor options (assuming Modbus on default UART)
monitor_speed = 19200 ; Match Modbus baud rate
monitor_flags =
    --raw             ; Useful for viewing raw Modbus data
    ; --echo          ; Echo local characters

lib_deps =
    ; No external libraries explicitly added here yet.
    ; If SoftwareSerial is needed for GSM, it might be added here,
    ; or we implement a basic bit-bang version.

```*Self-Correction:* Using `framework = arduino` but avoiding its functions is a common PlatformIO pattern for easier toolchain management with `avr-libc`. `-nostdlib` might be too aggressive if PlatformIO relies on some startup code; let's remove it and rely on `-Os` and `--gc-sections` for size optimization, assuming PlatformIO links `avr-libc` correctly. Added `build_unflags = -lm` if we truly replace standard math.

